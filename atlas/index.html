<style>
:root{color-scheme:dark;--bg:#101115;--panel:#191b20;--panel2:#22252b;--panel3:#292d34;--line:#363a42;--txt:#f2f1ed;--muted:#9ca1ad;--accent:#e4b96b;--green:#85bea7;--red:#d88f91;--blue:#93a9dc;--radius:13px;--shadow:0 15px 50px #0006}*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button,.btn{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:8px 12px}button:hover{border-color:#797d85;background:#30343b}button.primary{background:var(--accent);border-color:var(--accent);color:#211a0e;font-weight:750}button.primary:hover{background:#f0c985}button.ghost{background:transparent}input,textarea,select{border:1px solid var(--line);background:#121419;border-radius:9px;padding:9px 10px;outline:none;width:100%}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:90px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}h1,h2,h3,p{margin-top:0}h2{font-size:21px;letter-spacing:-.4px}h3{font-size:14px}.app{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr) 31px}.top{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#15171b}.logo{font-weight:900;letter-spacing:3px;font-size:21px}.logo i{font-style:normal;color:var(--accent)}.projectname{font-size:12px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topright{margin-left:auto;display:flex;gap:7px;align-items:center}.status{font-size:12px;color:var(--muted);margin-right:8px}.shell{min-height:0;display:grid;grid-template-columns:222px minmax(0,1fr) 342px}.sidebar{background:#17191d;border-right:1px solid var(--line);padding:16px 10px;overflow:auto}.side-title{color:#737985;font-size:10px;font-weight:800;letter-spacin ween;align-items:center}.tag{font-size:10px;border-radius:6px;padding:3px 7px;background:#353944;color:#d9dde6}.tag.gold{background:#4b3e29;color:#f1cc8a}.tag.red{background:#493135;color:#f2b4b4}.tag.green{background:#254039;color:#a8d9c5}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #30333a;vertical-align:top}th{position:sticky;top:0;background:#252830;color:#c9ccd4;font-size:11px;letter-spacing:.6px;text-transform:uppercase}tr:hover td{background:#25272d}tr.selected td{background:#343029}td button{padding:3px 7px}td small{color:var(--muted)}.empty{padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.graphwrap{position:relative;height:calc(100vh - 205px);min-height:400px;background-color:#15171b;background-image:radial-gradient(#3c3e44 1px,transparent 1px);background-size:24px 24px;overflow:hidden;border:1px solid var(--line);border-radius:13px;touch-action:none}.graphspace{position:absolute;top:0;left:0;transform-origin:0 0}.graphlines{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}.node{position:absolute;width:230px;min-height:113px;padding:12px 13px;background:#24262c;border:1px solid #51545b;border-left:4px solid var(--accent);border-radius:11px;box-shadow:0 8px 24px #0005;cursor:grab;user-select:none}.node:active{cursor:grabbing}.node.selected{border-color:#f0c985;box-shadow:0 0 0 2px #e4b96b55}.node small{color:#b0b3bb;font-size:10px}.node b{display:block;margin:7px 0;font-size:13px;line-height:1.25}.node .sub{font-size:11px;color:var(--muted);max-height:33px;overflow:hidden}.node[data-line="Кризис"]{border-left-color:var(--red)}.node[data-line="Дети"]{border-left-color:var(--green)}.node[data-line="Работа"]{border-left-color:var(--blue)}.graphhelp{position:absolute;left:15px;bottom:14px;background:#191b20e8;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:11px;color:var(--muted);pointer-events:none}.graphcontrols{position:absolute;right:12px;top:12px;display:flex;gap:5px}.graphcontrols button{background:#24262ce8}.timeline{position:relative;padding:10px 0 10px 32px;max-width:850px;margin:auto;border-left:2px solid #55505a}.tl-item{position:relative;margin:0 0 18px;padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}.tl-item:before{content:"";position:absolute;left:-40px;top:24px;width:13px;height:13px;background:var(--accent);border:3px solid var(--bg);border-radius:50%}.tl-item:hover{border-color:var(--accent)}.tl-item p{color:var(--muted);margin:8px 0 0}.board{display:flex;gap:13px;align-items:flex-start;min-height:450px;overflow-x:auto}.lane{min-width:245px;max-width:290px;flex:1;background:#191b20;border:1px solid var(--line);border-radius:12px;padding:12px}.lane h3{margin:4px 3px 13px}.lane .card{width:100%;margin-bottom:9px;min-height:100px}.lane .card h3{font-size:13px}.lane .card p{font-size:11px}.splitnote{padding:14px 17px;border-left:3px solid var(--accent);background:#2b2925;border-radius:0 9px 9px 0;margin-bottom:20px;color:#ded4c2}.chapter{margin-bottom:22px}.chapter h3{font-size:16px}.footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:5px 18px;color:#8c929d;font-size:11px}.modalshade{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.modalshade.show{display:flex}.modal{background:#22252b;border:1px solid #555a63;border-radius:16px;box-shadow:var(--shadow);padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{margin-bottom:8px}.modal .buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.hide{display:none!important}.characterbadge{height:45px;width:45px;display:grid;place-items:center;background:#4c4030;color:#f1d29c;border-radius:13px;font-weight:800;font-size:20px}.characterrow{display:flex;gap:13px;align-items:center}.muted{color:var(--muted)}.shortcut{font-size:11px;border:1px solid #555;padding:2px 5px;border-radius:4px}#notice{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);background:#e5bb72;color:#20190c;padding:9px 16px;border-radius:9px;z-index:20;display:none;font-weight:650}.mobilemenu{display:none}@media(max-width:1050px){.shell{grid-template-columns:64px minmax(0,1fr) 300px}.sidebar{padding:10px 5px}.nav{justify-content:center}.nav .navlabel,.side-title,.side-footer{display:none}.projectname{display:none}.statgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-rows:60px minmax(0,1fr) 29px}.shell{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:4px;grid-row:1}.shell{grid-template-rows:53px minmax(0,1fr)}.nav{width:auto;min-width:48px;padding:8px}.workspace{grid-row:2}.inspector{display:none;position:fixed;inset:60px 0 30px 10%;z-index:8;box-shadow:var(--shadow)}.inspector.open{display:block}.mobilemenu{display:inline-block}.content{padding:12px}.toolbar{padding:9px}.toolbar h2{font-size:17px}.topright .status{display:none}.topright button{padding:6px}.graphwrap{height:calc(100vh - 235px)}.statgrid{gap:8px}.stat{padding:11px}}
</style></head><body><div class="app"><header class="top"><div class="logo">АТЛ<i>А</i>С</div><div class="projectname" id="projectLabel"></div><div class="topright"><span class="status" id="saveStatus">Локальный проект</span><button id="undoBtn" title="Отменить (Ctrl+Z)">↶</button><button id="redoBtn" title="Повторить (Ctrl+Y)">↷</button><button id="exportBtn">↓ JSON</button><button id="importBtn">↑ Импорт</button><button class="primary" id="addBtn">＋ Событие</button></div></header><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="workspace"><div class="toolbar"><h2 id="viewTitle"></h2><input class="search" id="search" placeholder="Поиск по событиям и героям…"><select id="lineFilter" style="max-width:160px"><option value="">Все линии</option><option>Семья</option><option>Кризис</option><option>Дети</option><option>Работа</option><option>Отношения</option></select><div class="grow"></div><button class="ghost" id="mobileInspector">Свойства ☷</button><button id="helpBtn">?</button></div><div class="content" id="content"></div></main><aside class="inspector" id="inspector"></aside></div><footer class="footer"><span id="counts"></span><span>Данные сохраняются только в этом браузере · Резервная копия: JSON</span></footer></div><div id="notice"></div><div class="modalshade" id="modalshade"><div class="modal" id="modal"></div></div><input type="file" id="fileInput" accept=".json,application/json" hidden>
<script>
'use strict';
const KEY='atlas-public-demo-v2';
const lines=['Основная','Конфликт','Персонажи','Мир','Тайна','Финал'];
// Fictional, deliberately generic sample. No user project data is bundled.
const raw=[
['Неожиданное письмо','Главная героиня получает письмо без обратного адреса.','Основная'],
['Встреча в архиве','Старый знакомый предлагает помочь разобраться в загадке.','Персонажи'],
['Пропавший документ','В городском архиве обнаруживается отсутствие важной записи.','Тайна'],
['Спор о прошлом','Герои расходятся во мнениях о произошедшем много лет назад.','Конфликт'],
['Поездка к маяку','Поиски приводят героев к заброшенному маяку.','Мир'],
['Новая улика','Найденная записка меняет первоначальную версию событий.','Тайна'],
['Трудный выбор','Героиня решает рассказать правду, несмотря на последствия.','Конфликт'],
['Финальная встреча','Герои встречаются, чтобы обсудить открывшиеся обстоятельства.','Финал']
];
const demo=()=>({version:1,title:'Пример проекта · Тайна маяка',logline:'Вымышленный учебный сюжет: героиня ищет происхождение загадочного письма.',genre:'Детективная драма',events:raw.map((a,i)=>({id:'e'+(i+1),title:a[0],description:a[1],line:a[2],order:i+1,episode:'',screenOrder:'',status:'Пример',place:'',when:'',characters:['c1',...(i%2?['c2']:[])],notes:'',x:60+(i%4)*285,y:70+Math.floor(i/4)*155})),links:raw.slice(1).map((_,i)=>({from:'e'+(i+1),to:'e'+(i+2),type:'после'})),characters:[{id:'c1',name:'Героиня',role:'Главная роль',description:'Вымышленный персонаж учебного примера.'},{id:'c2',name:'Архивист',role:'Второстепенная роль',description:'Помогает героине искать документы.'}],episodes:[{id:'s1',title:'Серия 1',summary:'Начало расследования',number:1},{id:'s2',title:'Серия 2',summary:'Новые улики',number:2}],notes:'Это полностью вымышленный пример. Создайте новый проект или импортируйте собственный JSON локально.'});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||demo()}catch{state=demo()}if(!state.events||!state.characters)state=demo();let view='dashboard',selected=null,query='',filter='',undo=[],redo=[],pan={x:20,y:20,z:1},drag=null,saveTimer;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ev=id=>state.events.find(e=>e.id===id);const ch=id=>state.characters.find(e=>e.id===id);const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const sortEvents=a=>[...a].sort((a,b)=>(+a.order||0)-(+b.order||0));
function checkpoint(){undo.push(JSON.stringify(state));if(undo.length>60)undo.shift();redo=[]}function persist(){clearTimeout(saveTimer);$('saveStatus').textContent='Сохранение…';saveTimer=setTimeout(()=>{saveTimer=null;try{localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='Сохранено локально'}catch{$('saveStatus').textContent='Ошибка сохранения — экспортируйте JSON'}},250);updateCounts()}function change(fn,rerender=true){checkpoint();fn();persist();if(rerender)render()}function toast(t){let n=$('notice');n.textContent=t;n.style.display='block';clearTimeout(n._t);n._t=setTimeout(()=>n.style.display='none',2600)}function undoStep(which){let src=which==='undo'?undo:redo,dst=which==='undo'?redo:undo;if(!src.length)return;let entry=src.pop();if(entry&&typeof entry==='object'&&entry.kind==='move'){let item=ev(entry.id);if(!item)return;let pos=which==='undo'?entry.from:entry.to;item.x=pos.x;item.y=pos.y;dst.push(entry)}else{dst.push(JSON.stringify(state));if(dst.length>60)dst.shift();state=JSON.parse(entry)}persist();render()}function updateCounts(){$('counts').textContent=`${state.events.length} событий · ${state.characters.length} персонажей · ${state.episodes.length} серий · ${state.links.length} связей`;$('undoBtn').disabled=!undo.length;$('redoBtn').disabled=!redo.length}
const nav=[['dashboard','◈','Обзор'],['graph','⬡','Граф связей'],['timeline','↕','Хронология'],['table','▤','Таблица событий'],['board','▦','Доска сюжетов'],['episodes','▣','Серии'],['characters','♙','Персонажи'],['project','⚙','Проект']];function setView(v){view=v;selected=null;render()}function renderSidebar(){$('sidebar').innerHTML='<div class="side-title">МАСТЕРСКАЯ</div>'+nav.map(([id,ico,label])=>`<button class="nav ${view===id?'active':''}" data-nav="${id}" title="${label}"><span>${ico}</span><span class="navlabel">${label}</span></button>`).join('')+'<div class="side-footer">Автосохранение включено.<br>Файл JSON — перенос проекта между компьютерами.<br><br>АТЛАС · автономный редактор</div>';$('sidebar').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav))}
function visibleEvents(){let q=query.toLowerCase();return sortEvents(state.events.filter(e=>(!filter||e.line===filter)&&(!q||[e.title,e.description,e.place,e.notes,e.when,e.episode].some(v=>String(v||'').toLowerCase().includes(q)))))}function select(id){selected=id;renderInspector();if(view==='graph')document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));else renderContent();if(innerWidth<760)$('inspector').classList.add('open')}
function card(e){return `<button class="card ${selected===e.id?'selected':''}" data-event="${esc(e.id)}"><div class="cardtop"><span class="tag ${e.line==='Конфликт'?'red':e.line==='Персонажи'?'green':'gold'}">${esc(e.line)}</span><span class="pill">№ ${esc(e.order)}</span></div><h3>${esc(e.title)}</h3><p>${esc(e.description).slice(0,155)}${e.description.length>155?'…':''}</p></button>`}function bindCards(){document.querySelectorAll('[data-event]').forEach(n=>n.onclick=()=>select(n.dataset.event))}
function renderContent(){let root=$('content'),events=visibleEvents();root.style.padding=view==='graph'?'12px':'';if(view==='dashboard'){root.innerHTML=`<div class="splitnote"><b>Принцип проекта.</b> События, сценарные гипотезы и пробелы должны оставаться различимыми. Хронология жизни и порядок раскрытия зрителю редактируются отдельно.</div><div class="statgrid"><div class="stat"><strong>${state.events.length}</strong><span>событий</span></div><div class="stat"><strong>${state.characters.length}</strong><span>персонажей</span></div><div class="stat"><strong>${state.episodes.length}</strong><span>серий</span></div><div class="stat"><strong>${state.events.filter(e=>!e.episode).length}</strong><span>не распределено по сериям</span></div></div><div class="section-head"><h2>История</h2><button id="editProject">Изменить описание</button></div><div class="stat"><h3>${esc(state.title)}</h3><p>${esc(state.logline)}</p><span>${esc(state.genre)}</span></div><br><div class="section-head"><h2>Последние события хронологии</h2><button id="allEvents">Все события →</button></div><div class="cards">${sortEvents(state.events).slice(-6).map(card).join('')}</div>`;$('editProject').onclick=()=>setView('project');$('allEvents').onclick=()=>setView('table');bindCards()}
else if(view==='table'){root.innerHTML=`<div class="tablewrap"><table><thead><tr><th>№</th><th>Событие</th><th>Линия</th><th>Место / время</th><th>Серия</th><th>Статус</th></tr></thead><tbody>${events.map(e=>`<tr class="${selected===e.id?'selected':''}" data-event="${esc(e.id)}" style="cursor:pointer"><td>${esc(e.order)}</td><td><b>${esc(e.title)}</b><br><small>${esc(e.description).slice(0,130)}</small></td><td><span class="tag">${esc(e.line)}</span></td><td>${esc(e.place||'—')}<br><small>${esc(e.when)}</small></td><td>${esc(e.episode||'—')}</td><td>${esc(e.status)}</td></tr>`).join('')}</tbody></table></div>`;bindCards()}
else if(view==='timeline'){root.innerHTML=`<div class="splitnote">Порядок ниже — последовательность жизни героев. Для нелинейного монтажа используйте поля «Серия» и «Порядок показа».</div><div class="timeline">${events.map(e=>`<article class="tl-item" data-event="${esc(e.id)}"><span class="pill">${esc(e.order)} · ${esc(e.line)}</span> <span class="hint">${esc(e.when||'Дата не определена')}</span><h3 style="margin:8px 0">${esc(e.title)}</h3><p>${esc(e.description)}</p></article>`).join('')}</div>`;bindCards()}
else if(view==='board'){let groups=['Не назначено',...state.episodes.slice().sort((a,b)=>a.number-b.number).map(e=>e.title)];let grouped=new Map(groups.map(g=>[g,[]]));for(const e of events){let g=e.episode||'Не назначено';if(!grouped.has(g))grouped.set(g,[]);grouped.get(g).push(e)}root.innerHTML=`<div class="splitnote">Доска серий: откройте событие и выберите серию в правой панели. Порядок показа можно задать отдельно от хронологии.</div><div class="board">${groups.map(g=>`<div class="lane"><h3>${esc(g)} <span class="pill">${(grouped.get(g)||[]).length}</span></h3>${(grouped.get(g)||[]).map(card).join('')}</div>`).join('')}</div>`;bindCards()}
else if(view==='episodes'){root.innerHTML=`<div class="section-head"><h2>Структура сезона</h2><button class="primary" id="addEpisode">＋ Серия</button></div><div class="cards">${state.episodes.slice().sort((a,b)=>a.number-b.number).map(ep=>`<button class="card" data-episode="${esc(ep.id)}"><div class="cardtop"><span class="tag gold">Серия ${esc(ep.number)}</span><span class="pill">${state.events.filter(e=>e.episode===ep.title).length} событий</span></div><h3>${esc(ep.title)}</h3><p>${esc(ep.summary||'Синопсис не написан')}</p></button>`).join('')}</div>`;$('addEpisode').onclick=()=>editEpisode();root.querySelectorAll('[data-episode]').forEach(b=>b.onclick=()=>editEpisode(b.dataset.episode))}

function renderInspector(){let el=$('inspector'),e=ev(selected);if(!e){el.innerHTML=`<h2>Инспектор</h2><p class="muted">Выберите событие на графе, в таблице или на хронологии, чтобы редактировать его свойства.</p><div class="splitnote">Можно менять название, описание, последовательность, серию, место, персонажей и статус достоверности.</div><button class="primary" id="inspectAdd">＋ Новое событие</button>`;$('inspectAdd').onclick=addEvent;return}el.innerHTML=`<div class="section-head"><h2>Событие</h2><button class="mobilemenu" id="closeInspect">✕</button></div><div class="field"><label>Название</label><input data-prop="title" value="${esc(e.title)}"></div><div class="field"><label>Описание</label><textarea rows="6" data-prop="description">${esc(e.description)}</textarea></div><div class="twocol"><div class="field"><label>№ в жизни</label><input type="number" data-prop="order" value="${esc(e.order)}"></div><div class="field"><label>Порядок показа</label><input type="number" data-prop="screenOrder" value="${esc(e.screenOrder)}" placeholder="Не задан"></div></div><div class="field"><label>Сюжетная линия</label><select data-prop="line">${lines.map(x=>`<option ${x===e.line?'selected':''}>${x}</option>`).join('')}</select></div><div class="twocol"><div class="field"><label>Место</label><input data-prop="place" value="${esc(e.place)}" placeholder="Город / дом"></div><div class="field"><label>Когда</label><input data-prop="when" value="${esc(e.when)}" placeholder="Возраст / год"></div></div><div class="field"><label>Серия</label><select data-prop="episode"><option value="">Не назначена</option>${state.episodes.map(x=>`<option ${x.title===e.episode?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label>Статус</label><select data-prop="status">${['Подтверждено рассказом','Требует уточнения','Сценарная гипотеза','Вымысел'].map(x=>`<option ${x===e.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Участники</label>${state.characters.map(c=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" data-person="${esc(c.id)}" ${e.characters?.includes(c.id)?'checked':''} style="width:auto">${esc(c.name)}</label>`).join('')}</div><div class="field"><label>Заметки / вопросы</label><textarea data-prop="notes">${esc(e.notes)}</textarea></div><div class="actions"><button class="primary" id="saveEvent">Сохранить</button><button id="connectEvent">Связать →</button><button id="duplicateEvent">Копия</button><button id="deleteEvent" style="color:#e9a6a7">Удалить</button></div><p class="hint">Изменения фиксируются после нажатия «Сохранить».</p>`;el.querySelector('#closeInspect')?.addEventListener('click',()=>el.classList.remove('open'));el.querySelector('#saveEvent').onclick=()=>{let props={};el.querySelectorAll('[data-prop]').forEach(n=>props[n.dataset.prop]=n.value);props.order=Number(props.order)||1;props.screenOrder=props.screenOrder===''?'':Number(props.screenOrder);props.characters=[...el.querySelectorAll('[data-person]:checked')].map(n=>n.dataset.person);change(()=>Object.assign(e,props));toast('Событие сохранено')};el.querySelector('#deleteEvent').onclick=()=>confirmAction('Удалить событие и связанные с ним стрелки?',()=>change(()=>{state.events=state.events.filter(x=>x.id!==e.id);state.links=state.links.filter(l=>l.from!==e.id&&l.to!==e.id);selected=null}));el.querySelector('#duplicateEvent').onclick=()=>change(()=>{let c=structuredClone(e);c.id=uid('e');c.title+=' (копия)';c.order=Math.max(0,...state.events.map(x=>Number(x.order)||0))+1;c.x+=40;c.y+=40;state.events.push(c);selected=c.id});el.querySelector('#connectEvent').onclick=()=>connectDialog(e.id)}

function addEvent(){change(()=>{let e={id:uid('e'),title:'Новое событие',description:'',line:'Семья',order:Math.max(0,...state.events.map(x=>Number(x.order)||0))+1,episode:'',screenOrder:'',status:'Требует уточнения',place:'',when:'',characters:[],notes:'',x:100+Math.random()*150,y:100+Math.random()*150};state.events.push(e);selected=e.id});if(innerWidth<760)$('inspector').classList.add('open')}
function initGraph(events){
let wrap=$('graphwrap'),space=$('graphspace'),svg=$('graphlines');
const nodesById=new Map(events.map(e=>[e.id,e]));
const coords=e=>({x:Number(e.x)||0,y:Number(e.y)||0});
const pathData=(a,b)=>{let pa=coords(a),pb=coords(b),x1=pa.x+230,y1=pa.y+52,x2=pb.x,y2=pb.y+52;return `M${x1} ${y1} C${x1+65} ${y1},${x2-65} ${y2},${x2} ${y2}`};
const links=state.links.filter(l=>nodesById.has(l.from)&&nodesById.has(l.to));
svg.innerHTML='<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#8e8990" stroke-width="1.4"/></marker></defs>'+links.map(l=>`<path d="${pathData(nodesById.get(l.from),nodesById.get(l.to))}" fill="none" stroke="#77737c" stroke-width="1.7" marker-end="url(#arrow)"/>`).join('');
const linkEls=[...svg.querySelectorAll('path[marker-end]')];
const adjacent=new Map();links.forEach((l,i)=>{for(const id of new Set([l.from,l.to])){if(!adjacent.has(id))adjacent.set(id,[]);adjacent.get(id).push({link:l,path:linkEls[i]})}});
const nodeEls=new Map([...space.querySelectorAll('.node')].map(n=>[n.dataset.id,n]));
const transform=()=>{space.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${pan.z})`};transform();
let down=null,frame=0;
function drawDrag(){frame=0;if(!down)return;if(!down.node){transform();return}const e=nodesById.get(down.node),n=nodeEls.get(down.node);if(n){n.style.left=e.x+'px';n.style.top=e.y+'px'}for(const {link,path} of adjacent.get(down.node)||[])path.setAttribute('d',pathData(nodesById.get(link.from),nodesById.get(link.to)))}
const schedule=()=>{if(!frame)frame=requestAnimationFrame(drawDrag)};
function finish(cancel){if(!down)return;let d=down;down=null;if(frame){cancelAnimationFrame(frame);frame=0}if(d.node){let e=nodesById.get(d.node);if(cancel){e.x=d.ex;e.y=d.ey}else if(d.moved&&(e.x!==d.ex||e.y!==d.ey)){undo.push({kind:'move',id:d.node,from:{x:d.ex,y:d.ey},to:{x:e.x,y:e.y}});if(undo.length>60)undo.shift();redo=[];persist()}else if(!d.moved){select(d.node)}let n=nodeEls.get(d.node);if(n){n.style.left=e.x+'px';n.style.top=e.y+'px'}for(const {link,path} of adjacent.get(d.node)||[])path.setAttribute('d',pathData(nodesById.get(link.from),nodesById.get(link.to)))}else transform();updateCounts()}
wrap.onpointerdown=evt=>{if(evt.target.closest('.graphcontrols'))return;if(evt.button!==0&&evt.pointerType==='mouse')return;let node=evt.target.closest('.node'),e=node?nodesById.get(node.dataset.id):null;down={sx:evt.clientX,sy:evt.clientY,px:pan.x,py:pan.y,node:e?.id,ex:e?Number(e.x)||0:0,ey:e?Number(e.y)||0:0,moved:false};wrap.setPointerCapture(evt.pointerId)};
wrap.onpointermove=evt=>{if(!down)return;let dx=evt.clientX-down.sx,dy=evt.clientY-down.sy;if(Math.abs(dx)+Math.abs(dy)>4)down.moved=true;if(down.node){let e=nodesById.get(down.node);e.x=Math.round(down.ex+dx/pan.z);e.y=Math.round(down.ey+dy/pan.z)}else{pan.x=down.px+dx;pan.y=down.py+dy}schedule()};

wrap.onwheel=evt=>{evt.preventDefault();let z=Math.min(2.2,Math.max(.3,pan.z*(evt.deltaY<0?1.1:.9)));let rect=wrap.getBoundingClientRect(),mx=evt.clientX-rect.left,my=evt.clientY-rect.top;pan.x=mx-(mx-pan.x)*z/pan.z;pan.y=my-(my-pan.y)*z/pan.z;pan.z=z;transform()};
$('zoomIn').onclick=()=>{pan.z=Math.min(2.2,pan.z*1.2);transform()};$('zoomOut').onclick=()=>{pan.z=Math.max(.3,pan.z/1.2);transform()};$('zoomReset').onclick=()=>{pan={x:20,y:20,z:1};transform()};
$('fitGraph').onclick=()=>{if(!events.length)return;let minX=Math.min(...events.map(e=>Number(e.x)||0)),minY=Math.min(...events.map(e=>Number(e.y)||0)),maxX=Math.max(...events.map(e=>(Number(e.x)||0)+230)),maxY=Math.max(...events.map(e=>(Number(e.y)||0)+130));let z=Math.max(.3,Math.min(1.1,(wrap.clientWidth-70)/(maxX-minX),(wrap.clientHeight-70)/(maxY-minY)));pan={z,x:35-minX*z,y:35-minY*z};transform()};
}
function modal(html){$('modal').innerHTML=html;$('modalshade').classList.add('show')}function closeModal(){$('modalshade').classList.remove('show')}function confirmAction(message,fn){modal(`<h2>Подтверждение</h2><p>${esc(message)}</p><div class="buttons"><button id="cancel">Отмена</button><button class="primary" id="confirm">Подтвердить</button></div>`);$('cancel').onclick=closeModal;$('confirm').onclick=()=>{closeModal();fn()}}function connectDialog(from){if(state.events.length<2){toast('Сначала создайте второе событие');return}modal(`<h2>Связать события</h2><p class="muted">Создать направленную связь от «${esc(ev(from).title)}» к другому событию.</p><label>Куда</label><select id="linkTarget">${state.events.filter(e=>e.id!==from).map(e=>`<option value="${esc(e.id)}">${esc(e.order)} · ${esc(e.title)}</option>`).join('')}</select><label style="margin-top:12px">Тип связи</label><select id="linkType"><option>после</option><option>причина</option><option>следствие</option><option>параллельно</option><option>флешбэк</option></select><div class="buttons"><button id="cancel">Отмена</button><button class="primary" id="confirm">Добавить связь</button></div>`);$('cancel').onclick=closeModal;$('confirm').onclick=()=>{let to=$('linkTarget').value,type=$('linkType').value;if(!to||state.links.some(l=>l.from===from&&l.to===to)){toast('Такая связь уже есть');return}closeModal();change(()=>state.links.push({from,to,type}))}}
function editCharacter(id){let c=id?ch(id):{name:'',role:'',description:''};modal(`<h2>${id?'Персонаж':'Новый персонаж'}</h2><label>Имя</label><input id="cName" value="${esc(c.name)}"><label style="margin-top:12px">Роль</label><input id="cRole" value="${esc(c.role)}"><label style="margin-top:12px">Биография / конфликт / развитие</label><textarea id="cDesc" style="min-height:180px">${esc(c.description)}</textarea><div class="buttons">${id?'<button id="remove">Удалить</button>':''}<button id="cancel">Отмена</button><button class="primary" id="confirm">Сохранить</button></div>`);$('cancel').onclick=closeModal;$('confirm').onclick=()=>{let name=$('cName').value.trim();if(!name)return toast('Введите имя');let role=$('cRole').value,description=$('cDesc').value;closeModal();change(()=>{if(id)Object.assign(c,{name,role,description});else state.characters.push({id:uid('c'),name,role,description})})};if(id)$('remove').onclick=()=>{closeModal();confirmAction('Удалить персонажа?',()=>change(()=>{state.characters=state.characters.filter(x=>x.id!==id);state.events.forEach(e=>e.characters=e.characters.filter(x=>x!==id))}))}}
function editEpisode(id){let ep=id?state.episodes.find(e=>e.id===id):{number:state.episodes.length+1,title:'Серия '+(state.episodes.length+1),summary:''};modal(`<h2>${id?'Редактировать серию':'Новая серия'}</h2><label>Номер</label><input type="number" id="epNum" value="${esc(ep.number)}"><label style="margin-top:12px">Название</label><input id="epTitle" value="${esc(ep.title)}"><label style="margin-top:12px">Синопсис / кульминация / крючок</label><textarea id="epSummary" style="min-height:170px">${esc(ep.summary)}</textarea><div class="buttons">${id?'<button id="remove">Удалить</button>':''}<button id="cancel">Отмена</button><button class="primary" id="confirm">Сохранить</button></div>`);$('cancel').onclick=closeModal;$('confirm').onclick=()=>{let title=$('epTitle').value.trim(),number=Number($('epNum').value)||1,summary=$('epSummary').value;if(!title)return toast('Введите название');closeModal();change(()=>{if(id){let old=ep.title;Object.assign(ep,{title,number,summary});state.events.forEach(e=>{if(e.episode===old)e.episode=title})}else state.episodes.push({id:uid('s'),title,number,summary})})};if(id)$('remove').onclick=()=>{closeModal();confirmAction('Удалить серию? События останутся, но без назначения.',()=>change(()=>{state.episodes=state.episodes.filter(x=>x.id!==id);state.events.forEach(e=>{if(e.episode===ep.title)e.episode=''})}))}}

function importJSON(file){if(!file||file.size>10000000){toast('Файл слишком большой');return}let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.events)||!Array.isArray(obj.characters)||!Array.isArray(obj.links)||!Array.isArray(obj.episodes))throw Error('Неверная структура проекта');if(obj.events.length>5000||obj.characters.length>2000||obj.links.length>20000||obj.episodes.length>1000)throw Error('Слишком много элементов');if(!obj.events.every(e=>e&&typeof e.id==='string'&&typeof e.title==='string'&&typeof e.description==='string'&&Array.isArray(e.characters))||!obj.characters.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string')||!obj.links.every(l=>l&&typeof l.from==='string'&&typeof l.to==='string')||!obj.episodes.every(ep=>ep&&typeof ep.title==='string'))throw Error('Повреждённые элементы проекта');confirmAction('Заменить текущий проект импортированным? Сначала сохраните резервную копию.',()=>{change(()=>{state=obj;selected=null;pan={x:20,y:20,z:1}});toast('Проект импортирован')})}catch(e){toast('Ошибка импорта: '+e.message)}};r.readAsText(file)}

</script></body></html>
